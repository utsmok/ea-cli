[alembic]
script_location = migrations
# SQLAlchemy database URL: set this to your database or override via alembic CLI
sqlalchemy.url = postgresql+asyncpg://ea_user:ea_pass@localhost:5432/ea_db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stdout,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
