<!DOCTYPE html>
<html>
<head>
    <title>PDF Classification Viewer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
    <div class="container">
        <div id="file-list-panel">
            <h2>Documents</h2>
            <div id="file-list"></div>
        </div>
        <div id="pdf-viewer">
            <div id="pdf-container">
                <div id="loading-indicator" style="display: none;">
                    <div class="spinner"></div>
                    <p>Loading PDF...</p>
                </div>
                <div id="pdf-pages"></div>
            </div>
        </div>
        <div id="metadata-panel">
            <h2>Metadata</h2>
            <div id="json-content"></div>
            <div class="edit-controls">
                <div class="form-group">
                    <label for="item-type">Item Type:</label>
                    <select id="item-type">
                        <option value="presentation">Presentation</option>
                        <option value="reader">Reader</option>
                        <option value="book">Book</option>
                        <option value="article">Article</option>
                        <option value="report">Report</option>
                        <option value="assignment">Assignment</option>
                        <option value="thesis">Thesis</option>
                        <option value="manual">Manual</option>
                        <option value="unknown">Unknown</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="copyright-status">Copyright Status:</label>
                    <select id="copyright-status">
                        <option value="open access">Open Access</option>
                        <option value="own material">Own Material</option>
                        <option value="copyrighted material">Copyrighted Material</option>
                        <option value="other">Other</option>
                    </select>
                </div>
                <button id="save-changes">Save Changes</button>
            </div>
        </div>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.11.338/pdf.min.js"></script>
    <script src="/static/app.js"></script>
</body>
</html>
