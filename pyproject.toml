[project]
name = "ea-cli"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "openpyxl>=3.1.5",
    "typer>=0.12.5",
    "rich>=13.8.1",
    "polars[sqlalchemy]>=1.7.1",
    "python-dotenv>=1.0.1",
    "fastexcel>=0.11.6",
    "xlsxwriter>=3.2.0",
    "trogon>=0.6.0",
    "httpx>=0.28.1",
    "lxml>=5.3.0",
    "bs4>=0.0.2",
    "pyyaml",
    "loguru",
    "colorama",
    "nameparser",
    "levenshtein",
    "selenium",
    "google-genai>=1.2.0",
    "aiometer>=0.5.0",
    "pdfminer.six==20231228",
    "ea-cli",
    "tortoise-orm[accel]",
    "connectorx>=0.4.2",
    "python-fasthtml",
    "monsterui",
    "pypdf",
    "xxhash>=3.5.0",
    "qdrant-client[fastembed]",
    "pdfreader",
    "pikepdf",
    "kreuzberg",
    "streamlit",
    "uvicorn",
    "ruff>=0.11.4",
    "pymupdf4llm",
    "pytesseract",
]

[tool.uv.sources]
ea-cli = { workspace = true }


[tool.ruff.lint]
select = [
    # pycodestyle
    "E",
    # Pyflakes
    "F",
    # pyupgrade
    "UP",
    # flake8-bugbear
    "B",
    # flake8-simplify
    "SIM",
    # isort
    "I",
]
ignore = ["F405", "E501", "F403"]
