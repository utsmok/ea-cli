[project]
name = "ea-cli"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = "==3.12.2"
dependencies = [
    "pyyaml",
    "levenshtein",
    "openpyxl",
    "typer",
    "polars[sqlalchemy]",
    "xlsxwriter",
    "httpx",
    "bs4",
    "loguru",
    "aiometer",
    "tortoise-orm[accel]",
    "tqdm",
    "fastexcel>=0.15.1",
    "webcolors>=24.11.1",
    "xxhash",

]

[tool.uv]
default-groups = ["dev"]

[dependency-groups]

tui = [
    "trogon"
]

dev = [
    {include-group="lint"},
    {include-group="test"},
]

lint = [
    "ruff",
    "ty",
]
test = [
    "pytest",
    "pytest-asyncio",
]

pdf = [
    "kreuzberg[crypto]",
]

dashboard = [
    "fastlite",
    "fastcore",
    "starlette",
    "monsterui",
    "python-fasthtml",
]
llm = [
    "dspy>=3.0.3",
    "ollama>=0.5.4",
]
ocr = [
    "torch",
    "torchvision",
    "pdf2image",
    "paddleocr[all]>=3.2.0",
    "gliner>=0.2.22",
    "semchunk>=3.2.3",
]

[tool.uv.sources]
ea-cli = { workspace = true }
torch = [
  { index = "pytorch-cu129"},
]
torchvision = [
  { index = "pytorch-cu129" },
]


[[tool.uv.index]]
name = "pytorch-cu129"
url = "https://download.pytorch.org/whl/cu129"
explicit = true


[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = [
    # pycodestyle
    "E",
    # Pyflakes
    "F",
    # pyupgrade
    "UP",
    # flake8-bugbear
    "B",
    # flake8-simplify
    "SIM",
    # isort
    "I",
]
ignore = ["F405", "E501", "F403"]
