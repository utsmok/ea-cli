[project]
name = "ea-cli"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = "==3.12.2"
dependencies = [
    "openpyxl",
    "typer",
    "polars[sqlalchemy]",
    "python-dotenv",
    "xlsxwriter",
    "trogon",
    "httpx",
    "lxml",
    "bs4",
    "pyyaml",
    "loguru",
    "nameparser",
    "levenshtein",
    "aiometer",
    "tortoise-orm[accel]",
    "tqdm",
    "fastexcel>=0.15.1",
]

[tool.uv]
default-groups = ["dev"]

[dependency-groups]
dev = [
    {include-group="lint"},
    {include-group="test"}
]

lint = [
    "ruff",
    "ty",
]
test = [
    "pytest",
    "pytest-asyncio",
]

classification = [
    "pikepdf",
    "numpy",
    "pydantic",
    "pypdf",
    "xxhash",
    "kreuzberg[paddleocr]",
    "qdrant-client[fastembed]",
    "pdfreader",
    "flashtext",
    "fastlite",
    "spacy",
    "spacy-layout",
    "sqlglot",
    "sentence-transformers",
    "pymupdf4llm",
    "pytesseract",
    "gliner",
    "langchain-text-splitters",
    "selenium",
    "google-genai",

]
dashboard = [
    "fastcore",
    "starlette",
    "monsterui",
    "python-fasthtml",
]

[tool.uv.sources]
ea-cli = { workspace = true }

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = [
    # pycodestyle
    "E",
    # Pyflakes
    "F",
    # pyupgrade
    "UP",
    # flake8-bugbear
    "B",
    # flake8-simplify
    "SIM",
    # isort
    "I",
]
ignore = ["F405", "E501", "F403"]
