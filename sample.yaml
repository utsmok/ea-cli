# configuration for sample dataset creation process
# Define your settings below


input:
  file:
  filters: #  Create a new filter for each column you want to filter on.
    - column: # column name
      include: # specific values in a list eg ['a', 'b', 'c'] or [1, 2, 3] etc
      exclude:
      min: # min value
      max: # max value

output:
  file:
  columns: # list of cols to include, in order
  max_rows:
  remove_duplicates: true
  filters: #  Create a new filter for each column you want to filter on.
    - column: # column name
      include: # specific values in a list eg ['a', 'b', 'c'] or [1, 2, 3] etc
      exclude:
      min: # min value
      max: # max value

  selection:
    # for each col, make sure each value in the dataset is included at least min times and/or at most max times
    # e.g. faculty with min 5 and max 10: each faculty will have at least 5 rows and at most 10 rows
    - column: 'faculty'
      min: 5
      max: 10
    - column: 'type'
      min: 3
      max: 8
    - column: 'classification'
      min: 2
      max: 6
