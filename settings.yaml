# This yaml file contains all settings for the ea-cli script.
# Comments are provided in this file to explain the settings.
# Note that missing settings will at best result in warnings or errors, at worst silently making errors in the output.

unsorted:
# values that don't (yet) fit anywhere else
  fine_amount: 0.3 # fine amount per page per item per student
  dashboard_reload: true # Auto-reload dashboard on code changes (dev setting)
  classification_options:
    - open access
    - eigen materiaal - powerpoint
    - eigen materiaal - overig
    - lange overname
    - eigen materiaal - titelindicatie
    - anders
    - korte overname
    - middellange overname
    - onbekend
backup:
  # backup all sheets in selected directories before starting? (bool)
  backup_all: true
  # directories to backup, use keys from the 'directories' section
  backup_dirs:
    - faculties_dir
  # maximum number of backups to keep (int)
  max_backups: 40
  # backup overview files (move them to overview_backup instead of deleting)? (bool)
  # note that this settings is separate from backup_all!
  backup_overviews: true


directories:
# The directories to retrieve / store files. The directories should be folder names in the same directory as the script.
  raw_copyright_data: raw_copyright_data # Directory where the raw copyright data is downloaded to (output from qlik)
  full_data: full_data # subdir of raw_copyright_data containing exports that are not filtered by classification status
  export_to_surf: copyright_data_for_SURF_import # The script will export files here to be sent to SURF for importing data.
  faculties_dir: faculty_sheets # Here the sheets per faculty will be stored -- the most important output of the script.
  all_items_dir: cip_sheets # Sheets with all items here, for quick reference and overview for the CIP.
  overviews_backup: overviews_backup # Backup folder for 'overview' sheets, which are replaced each time the script runs.
  full_backups: full_backups # Backup folder for entire faculty dir backups, see 'backup' section
  script_data: script_data # Data directly used by the script, such as 'full_data.csv' and 'ea-cli.log'
  pdf_downloads: pdf_downloads # Directory for pdf downloads

# additional specific file paths. Will be stored in script_data directory defined above.
files:
  # folder where all these files will be stored/retrieved from. If blank/null, use working dir
  folder: script_data
  subfolders:
    classifications: classifications # json files with classifications
  files:
    # Enrichment related files
    full_data_csv: full_data.csv
    full_data_parquet: full_data.parquet
    osiris_data: osiris_data.json
    osiris_data_w_contacts: osiris_data_w_contacts.json
    person_data: person_data.json

# settings for data input/output/processing
data_settings:
  # sheet details for the complete data sheet & data entry sheet present in each output excel file.
  # parameters: sheet name; cols to be included
  # if cols is not specified, all cols will be added to this sheet..
  complete_data_name: Complete data
  complete_data_cols: null
  data_entry_name: Data entry
  data_entry_cols:
    - name: "material_id"
    - name: "is_duplicate"
    - name: "replacement_id"
    - name: "url"
      is_url: true
    - name: "workflow_status"
      is_new: true
      is_editable: true
      dropdown_options: '"ToDo,Done,InProgress"'
      default_val: "ToDo"
    - name: "manual_classification"
      is_editable: true
      dropdown_options: '"open access,eigen materiaal - powerpoint,eigen materiaal - overig,lange overname,eigen materiaal - titelindicatie,anders,korte overname,middellange overname,-"'
    - name: "remarks"
      is_editable: true
    - name: "ml_prediction"
    - name: "filename"
    - name: "title"
    - name: 'owner'
      new_name: "uploaded_by"
    - name: "author"
      new_name: "detected_author"
    - name: "course_contacts_names"
    - name: "course_contacts_emails"
    - name: "course_contacts_organizations"
    - name: 'course_name'
      new_name: "course_name_canvas"
    - name: "course_names"
      new_name: "course_names_osiris"
    - name: "department"
      new_name: "programme_canvas"
    - name: "programmes"
      new_name: "programmes_osiris"

  raw_data_col_order: !!seq [
        material_id,
        is_duplicate,
        replacement_id,
        period,
        department,
        course_code,
        course_name,
        url,
        filename,
        title,
        owner,
        filetype,
        classification,
        type,
        ml_prediction,
        manual_classification,
        manual_identifier,
        scope,
        remarks,
        auditor,
        last_change,
        status,
        google_search_file,
        isbn,
        doi,
        in_collection,
        pagecount,
        wordcount,
        picturecount,
        author,
        publisher,
        reliability,
        pages_x_students,
        count_students_registered,
        retrieved_from_copyright_on,
        workflow_status,
        faculty,
    ]

  final_data_col_order: !!seq [
    material_id,
    is_duplicate,
    replacement_id,
    period,
    department,
    course_code,
    course_name,
    url,
    filename,
    title,
    owner,
    filetype,
    classification,
    type,
    ml_prediction,
    manual_classification,
    manual_identifier,
    scope,
    remarks,
    auditor,
    last_change,
    status,
    google_search_file,
    isbn,
    doi,
    in_collection,
    pagecount,
    wordcount,
    picturecount,
    author,
    publisher,
    reliability,
    pages_x_students,
    count_students_registered,
    retrieved_from_copyright_on,
    workflow_status,
    possible_fine,
    infringement,
    faculty,
    course_contacts_faculties,
    course_contacts_names,
    course_contacts_emails,
    course_contacts_organizations,
    course_names,
    cursuscodes,
    osiris_catalogue_url,
    programmes,
  ]






  new_fields:
  # fields not present in raw data (so added by this script) that need configuration should be added here
  # the key will be used as the field name.
  # possible parameters:
  # - values: list of possible values for this field
  # - default: default value for this field
    workflow_status:
      values:
      # NOTE! Order is important here:
      # - First field in this list is the default field
      # - For merge conflicts, fields lower in the list will be preferred, e.g. by default: Done > InProgress > ToDo
        - ToDo
        - InProgress
        - Done
      default:
        - ToDo
    faculty: # values are set dynamically based on the faculty mapping in the settings in the 'university' section
      default:
        - Unmapped

  url_truncation_marker: "..." # Marker indicating a truncated URL
  url_default_base: "https://utwente.instructure.com/files" # Default base to prepend if marker is found


# University settings
# Set all the data for your university. This data is essential for the script to separate data into faculties and programmes;
# and also to enrich the copyright data with additional information.

university:
  name: University of Twente
  abbreviation: UT
  lms: # Learning Management System
    name: canvas
    url: https://canvas.utwente.nl
  course_catalogue: # The course catalogue of the university, to retrieve extra info about courses
    name: OSIRIS
    url: https://utwente.osiris-student.nl/onderwijscatalogus/extern/cursus
